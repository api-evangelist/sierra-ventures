aid: sierra-ventures
name: Sierra Ventures
description: >-
  Sierra Ventures is an early-stage venture capital firm founded by Peter
  Wendell in 1982 and headquartered in San Mateo, California, in the heart of
  Silicon Valley. The firm invests from inception through Series A in
  first-principles founders under the tagline "Conviction Before Consensus,"
  writing checks of up to $5M at seed and up to $10M at Series A. Sierra's
  current investment thesis centers on the next wave of enterprise technology:
  Vertical AI (purpose-built AI for specific industries), Infrastructure AI,
  Frontier and Deep Tech, and Physical AI and Robotics, alongside a longstanding
  history in enterprise applications, digital health, SaaS, and security. Over
  its 40-plus-year history the firm has invested more than $2 billion across 13
  early-stage funds, with its 13th fund closing in 2023 at $265 million,
  following Fund 12 at $215 million and Fund 11 at $170 million. Sierra reports
  35 IPOs and hundreds of successful exits, having backed companies such as
  Elastic, Astronomer, Chronosphere, CourseHero, Q-CTRL, Spectro Cloud, Endor
  Labs, and Reflection AI. The firm is notable for its CXO Advisory Board of
  Fortune 1000 enterprise leaders who help portfolio companies land early
  customers. This profile tracks Sierra Ventures' identity and its portfolio
  graph across the API Evangelist network.
